name: Build ProtectionTest

on:
  push:
    branches: [ master ]      # сборка при каждом пуше в master
  workflow_dispatch:          # ручной запуск кнопкой «Run workflow» во вкладке Actions

permissions:
  contents: write

env:
  QT_VERSION: 6.8.2
  APP_NAME: ProtectionTest

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt (MSVC)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall
          aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir "$env:GITHUB_WORKSPACE/Qt"
          echo "Qt6_DIR=$env:GITHUB_WORKSPACE/Qt/$env:QT_VERSION/msvc2022_64" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S "${{ github.workspace }}" `
                -B "${{ github.workspace }}/build" `
                -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deploy"

      - name: Build
        shell: pwsh
        run: cmake --build "${{ github.workspace }}/build" --config Release

      - name: Install (exe + Qt libraries via windeployqt)
        shell: pwsh
        run: cmake --install "${{ github.workspace }}/build" --config Release

      - name: Pack to ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}/deploy/*" `
                           -DestinationPath "${{ github.workspace }}/${{ env.APP_NAME }}-win64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-win64
          path: ${{ github.workspace }}/deploy

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ${{ env.APP_NAME }} v1.0.${{ github.run_number }}
          body: |
            Автоматическая сборка из ветки `master`.

            Коммит: ${{ github.sha }}
            Сообщение: ${{ github.event.head_commit.message }}

            Распакуйте архив и запустите `${{ env.APP_NAME }}.exe` (папка `bin`).
          files: ${{ github.workspace }}/${{ env.APP_NAME }}-win64.zip
